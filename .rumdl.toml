# Markdown lint (rumdl, pinned in mise.toml; `mise run lint-docs`). markdownlint's rules, with three changes:
[global]
flavor = "gfm"
# Line length is oxfmt's (.oxfmtrc.json); tables and screen blocks run past any fixed width.
# A code span may hold a glyph and the space after it (`├ `), as the Cockpit spec writes them.
disable = ["MD013", "MD038"]
# Kept as written: earlier design rounds and briefs, past plans, the generator's templates and the brand kit.
# CHANGELOG.md is release-please's output, written whole on every release (two blank lines before each section).
exclude = ["docs/design/history/**", "docs/development/plans/**", "tools/mockgen/tpl/**", "docs/design/brand/**", "CHANGELOG.md"]

[per-file-ignores]
# The README opens with the brand header: a <picture> for the dark and light variants, before any heading.
"README.md" = ["MD033", "MD041"]
# A PR body opens with its first section; the PR title is its heading.
".github/pull_request_template.md" = ["MD041"]

[MD033]
# A <picture> switches a diagram between its dark and light versions; nothing else needs HTML.
allowed-elements = ["picture", "source", "img", "p"]
