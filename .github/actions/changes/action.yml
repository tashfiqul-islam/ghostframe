name: Changes
description: >-
  Which jobs a change needs: tools/ci/map.ts sorts the changed files (each rule says what it guards), and this outputs
  each decision. Jobs skip with `if:`, never by a workflow's `on: paths`, so every required check still reports. A
  scheduled or dispatched run, a push (unless diff-pushes), and the release-please pull request run everything.
  Expects the repository checked out with `fetch-depth: 2`: a pull request's checkout is its merge commit, whose first
  parent is the base branch as it is now; a push's first parent is the commit before it. Docs:
  docs/development/ci.md.

inputs:
  diff-pushes:
    description: "'true' to sort a push's own files too (the report-only benchmarks), instead of running everything."
    required: false
    default: 'false'

# One output per decision in tools/ci/map.ts (DECISIONS); `bun tools/ci/ci.ts --check` fails when they differ.
outputs:
  gate:
    description: The Quality gate runs.
    value: ${{ steps.plan.outputs.gate }}
  docs:
    description: The Docs job runs (a change with no code).
    value: ${{ steps.plan.outputs.docs }}
  settings:
    description: The Repo settings job runs (a change to repo settings and no code).
    value: ${{ steps.plan.outputs.settings }}
  tests:
    description: The Tests jobs run.
    value: ${{ steps.plan.outputs.tests }}
  plugin_tests:
    description: The Tests jobs run the plugin's tests, not only the status line's specs.
    value: ${{ steps.plan.outputs.plugin_tests }}
  perf:
    description: The Performance check and the benchmarks measure.
    value: ${{ steps.plan.outputs.perf }}
  readme:
    description: README's checks run.
    value: ${{ steps.plan.outputs.readme }}
  site:
    description: The website's job runs.
    value: ${{ steps.plan.outputs.site }}

runs:
  using: composite
  steps:
    - name: Set up Bun (mise)
      uses: $/.github/actions/setup
      with:
        install: 'false'

    - name: Plan the jobs from the changed files (tools/ci/map.ts)
      id: plan
      shell: bash
      env:
        DIFF_PUSHES: ${{ inputs.diff-pushes }}
      run: bun tools/ci/ci.ts github
