name: Feature request
description: Something ghostframe could show or do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The situation, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: What you'd like to see. A sketch or a screenshot of something similar helps.
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Which part
      options:
        - Cockpit, the left
        - Cockpit, the pane
        - The status line
        - Something else
    validations:
      required: true
