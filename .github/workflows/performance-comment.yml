name: Performance comment
run-name: 'Performance comment · ${{ github.event.workflow_run.display_title }}'

# Writes the Performance check's result as one comment on its pull request, edited in place on every push. It runs from
# main's code (workflow_run), never checks out or runs the pull request's, and treats what the check uploaded as
# untrusted text: the pull request's number is taken from GitHub, not the upload, and the comment is only posted on
# the pull request whose head the check ran on. So a fork's pull request gets its comment without ever holding a token
# that can write.

on:
  # The one safe use of this trigger: nothing here checks out or runs the pull request's code, the upload is read as
  # text and checked (above), and the token can write comments only.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Performance]
    types: [completed]

concurrency:
  group: performance-comment-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  comment:
    name: Post the Performance comment
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # download the check's upload, and find the latest live benchmark on main
      pull-requests: write # write the comment
    steps:
      - name: Download the check's comment
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: performance-comment
          path: ${{ runner.temp }}/perf
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Post it, or edit the one already there
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          MARKER: '<!-- ghostframe-performance -->'
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/perf"
          # The pull request from GitHub: the open one whose head is the commit the check ran on.
          claimed=$(head -c 20 "$dir/pr.txt" | tr -cd '0-9')
          # As fields, never pasted into the URL: a branch name may hold & or =.
          pr=$(gh api --method GET "repos/$REPO/pulls" -f state=open -f head="$HEAD_OWNER:$HEAD_BRANCH" --jq ".[] | select(.head.sha == \"$HEAD_SHA\") | .number" | head -n 1)
          if [ -z "$pr" ] || [ "$pr" != "$claimed" ]; then echo "::error::No open pull request has head $HEAD_SHA (the upload names #$claimed)"; exit 1; fi

          body=$(head -c 60000 "$dir/comment.md")
          if [[ "$body" != "$MARKER"* ]]; then echo "::error::The upload is not a Performance comment"; exit 1; fi
          live=$(gh api "repos/$REPO/actions/workflows/benchmarks.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].html_url // empty')
          if [ -n "$live" ]; then body="$body"$'\n\n'"The live benchmark (never blocks) runs on main nightly and on each push: [its latest run]($live)."; fi

          id=$(gh api --paginate "repos/$REPO/issues/$pr/comments" --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$MARKER\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
            echo "Edited comment $id on #$pr."
          else
            gh api --method POST "repos/$REPO/issues/$pr/comments" -f body="$body" > /dev/null
            echo "Posted a comment on #$pr."
          fi
