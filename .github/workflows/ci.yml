name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # The CLI is the mod's runtime and test runner. Bump both lines together:
  # the checksum comes from downloads.claude.ai/claude-code-releases/<version>/manifest.json.
  CLAUDE_CODE_VERSION: 2.1.326
  CLAUDE_CODE_SHA256: b6b3647d981130dc44fc670846ae97b6cde531ffb667cf9c4d17cfcafb38cb37
  DISABLE_AUTOUPDATER: '1'

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # check out the code
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Claude Code CLI
        id: setup
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/claude-config"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/bin/claude" \
            "https://downloads.claude.ai/claude-code-releases/${CLAUDE_CODE_VERSION}/linux-x64/claude"
          echo "${CLAUDE_CODE_SHA256}  $RUNNER_TEMP/bin/claude" | sha256sum --check --strict -
          chmod +x "$RUNNER_TEMP/bin/claude"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          # An empty config dir: the gates need no login and read no user settings.
          echo "CLAUDE_CONFIG_DIR=$RUNNER_TEMP/claude-config" >> "$GITHUB_ENV"

      - name: Validate plugin
        run: claude plugin validate .

      - name: Test plugin
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: claude plugin test .

      - name: Install bun
        id: bun
        if: ${{ !cancelled() }}
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: bun

      - name: Install dev tools
        id: tools
        if: ${{ !cancelled() && steps.bun.outcome == 'success' }}
        run: bun install --cwd tools --frozen-lockfile --ignore-scripts

      - name: Check format
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: bun run --cwd tools fmt:check

      # Type-aware rules and tsc need the engine's generated declarations, which only a
      # local session writes (they are never committed), so CI runs the syntax rules.
      - name: Lint
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: bun run --cwd tools lint:ci

  workflows:
    name: workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the workflows
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      - name: Audit workflows
        if: ${{ !cancelled() }}
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          persona: auditor
