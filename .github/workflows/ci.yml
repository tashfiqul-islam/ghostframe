name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

defaults:
  run:
    shell: bash

env:
  # The CLI is the mod's runtime and test runner. Bump both lines together:
  # the checksum comes from downloads.claude.ai/claude-code-releases/<version>/manifest.json.
  CLAUDE_CODE_VERSION: 2.1.326
  CLAUDE_CODE_SHA256: b6b3647d981130dc44fc670846ae97b6cde531ffb667cf9c4d17cfcafb38cb37
  DISABLE_AUTOUPDATER: '1'

jobs:
  check:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # check out this repo
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain and dev tools
        id: setup
        uses: $/.github/actions/setup
        with:
          tools: bun actionlint zizmor shellcheck lychee

      - name: Install Claude Code CLI (pinned, checksum-verified)
        id: cli
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/claude-config"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/bin/claude" \
            "https://downloads.claude.ai/claude-code-releases/${CLAUDE_CODE_VERSION}/linux-x64/claude"
          echo "${CLAUDE_CODE_SHA256}  $RUNNER_TEMP/bin/claude" | sha256sum --check --strict -
          chmod +x "$RUNNER_TEMP/bin/claude"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          # An empty config dir: the gates need no login and read no user settings.
          echo "CLAUDE_CONFIG_DIR=$RUNNER_TEMP/claude-config" >> "$GITHUB_ENV"

      # The gate (`mise run check` locally), one step per tool so a failure names itself. Where a
      # tool speaks GitHub's annotation format, errors land inline on the PR diff. tsc and the
      # type-aware lint rules need the engine's generated declarations, which only a local session
      # writes (they are never committed), so they run in the local gate only.
      - name: Validate plugin (claude plugin validate)
        if: ${{ !cancelled() && steps.cli.outcome == 'success' }}
        run: claude plugin validate .

      - name: Test plugin (claude plugin test)
        if: ${{ !cancelled() && steps.cli.outcome == 'success' }}
        run: claude plugin test .

      - name: Lint (oxlint, syntax rules)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run --cwd tools lint:ci

      - name: Format check (oxfmt)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run --cwd tools fmt:check

      - name: Lint workflows (actionlint)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          # shellcheck disable=SC2016 # `$err` is a Go template variable, not a shell one
          actionlint -format '{{range $err := .}}::error file={{$err.Filepath}},line={{$err.Line}},col={{$err.Column}},title=actionlint {{$err.Kind}}::{{$err.Message}}
          {{end}}'

      - name: Audit workflows (zizmor)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: zizmor --offline --persona auditor --format github .github

      - name: Lint shell scripts (shellcheck)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          if (( ${#scripts[@]} )); then shellcheck "${scripts[@]}"; else echo "No shell scripts."; fi

      - name: Check docs links and anchors (lychee, offline)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: mise run lint-docs

  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # read the dependency diff
    steps:
      - name: Review dependency changes for vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
