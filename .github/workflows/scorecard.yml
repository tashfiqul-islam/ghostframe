name: OpenSSF Scorecard
run-name: OpenSSF Scorecard · ${{ github.event_name == 'schedule' && 'weekly' || github.ref_name }}

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  analysis:
    # GitHub adds a "Pull ghcr.io/ossf/scorecard-action:…" step to this job: the action ships
    # only as a Docker image, and that pre-step can't be renamed.
    name: Supply-chain security analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # check out the code
      id-token: write # publish results to the OpenSSF API
      security-events: write # upload the SARIF report to code scanning
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Score supply-chain practices and publish the results (scorecard)
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload the SARIF report to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
