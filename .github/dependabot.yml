version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: bun
    directory: /tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      dev-tools:
        patterns: ['*']
  - package-ecosystem: bun
    directory: /tools/live
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      live-checks:
        patterns: ['*']
  - package-ecosystem: bun
    directory: /docs/assets
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      screenshots:
        patterns: ['*']
