# Single source of truth for tool versions: local dev and CI (jdx/mise-action).
# The Claude Code CLI is pinned in .github/workflows/ci.yml with its checksum.
[tools]
bun = "1.4.4"
hk = "2.12.0"
pkl = "0.33.0"
actionlint = "1.7.12" # workflow syntax, expressions, shellcheck
zizmor = "1.32.0" # workflow security audit
shellcheck = "0.11.0" # shell scripts
lychee = "0.24.2" # Markdown link and anchor check
rumdl = "0.3.4" # Markdown lint (markdownlint's rules)

[tasks.setup]
description = "Install dev tools and git hooks"
run = ["bun install --cwd tools --frozen-lockfile", "hk install --mise"]

[tasks.check]
description = "The whole gate: types, lint, format, plugin validation, tests, workflows, docs"
run = ["mise run lint-js", "bun run --cwd tools check", "mise run lint-actions", "mise run lint-docs"]

[tasks."ci:plan"]
description = "Print what CI will run for this branch against origin/main, and why (tools/ci/map.ts). Run it before pushing"
run = "bun tools/ci/ci.ts plan"

[tasks."ci:run"]
description = "Run here exactly what CI will run for this branch (or the jobs named: mise run ci:run -- check tests)"
run = "bun tools/ci/ci.ts run"

[tasks.lint-actions]
description = "Lint and audit GitHub Actions workflows and composite actions"
run = ["actionlint", "zizmor --offline .github"]

[tasks.lint-docs]
shell = "bash -c"
description = "Lint the Markdown (rumdl, .rumdl.toml) and check every relative link and #anchor in it (offline, deterministic)"
run = "rumdl check . && files=$(git ls-files '*.md'); [ -z \"$files\" ] || lychee --offline --include-fragments --no-progress $files"

[tasks.lint-js]
shell = "bash -c"
# The repo is TypeScript-only: Bun and the plugin host run .ts directly. No file is allowlisted; one that truly
# cannot be TypeScript would be excluded here by name, with its reason beside it.
description = "Fail on any tracked JavaScript file (.js, .mjs, .cjs, .jsx)"
run = "files=$(git ls-files -- '*.js' '*.mjs' '*.cjs' '*.jsx'); if [ -n \"$files\" ]; then printf 'JavaScript is not allowed here (the repo is TypeScript-only):\n%s\n' \"$files\"; exit 1; fi; echo 'No JavaScript files.'"
